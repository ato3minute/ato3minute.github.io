<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111923">
  <title>あと3分だけ。</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section id="welcome" aria-labelledby="welcome-title">
      <a class="world-picker" href="../index.html#worlds">← 世界を選び直す</a>
      <div class="moon" aria-hidden="true"></div>
      <p class="eyebrow">小さな、物語への寄り道</p>
      <h1 id="welcome-title">あと3分だけ。</h1>
      <p class="intro">あの日の自分に、<br>少しだけ会いにいこう。</p>
      <div class="choices">
        <button id="with-sound" type="button">音ありで見る <span aria-hidden="true">↗</span></button>
        <button id="without-sound" type="button">音なしで見る</button>
      </div>
      <p class="hint">約75秒の物語 · タップで次の場面へ</p>
      <p id="loading" class="hint" role="status">画像を準備しています…</p>
    </section>
    <section id="player" aria-label="あの日の自分の物語" hidden>
      <div id="scenes"></div>
      <button id="next" type="button" aria-label="次の場面へ"></button>
      <div class="brand" aria-hidden="true">あと3分だけ。</div>
      <p id="scene-description" class="sr-only" aria-live="polite"></p>
      <section id="introduction" aria-label="物語の続きへ" hidden>
        <p id="intro-first" class="intro-line" hidden>あの頃、<br>自分は何者にでもなれると思っていた。</p>
        <p id="intro-second" class="intro-line" hidden>大人になった今も、<br>その続きを考えてしまう人へ。</p>
        <div id="intro-work" hidden>
          <h2>左ききのエレン</h2>
          <p id="intro-question" hidden>才能とは何か。<br>何者かになるとは何か。</p>
          <a id="work-cta" href="ellen.html" hidden>この物語を覗いてみる →</a>
        </div>
      </section>
      <div class="controls">
        <div class="progress" role="progressbar" aria-label="物語の進行" aria-valuemin="0" aria-valuemax="75" aria-valuenow="0"><div id="progress-fill"></div></div>
        <div class="control-row">
          <button id="toggle" type="button">一時停止</button>
          <span id="time" aria-hidden="true">0:00 / 1:15</span>
          <button id="restart" type="button">最初から</button>
        </div>
      </div>
    </section>
  </main>
  <audio id="bgm" src="assets/audio/ながれぼし.mp3" preload="metadata" loop hidden></audio>
  <noscript>この物語を見るには、ブラウザのJavaScriptを有効にしてください。</noscript>
</body>
</html>
