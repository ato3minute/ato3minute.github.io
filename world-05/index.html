<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>好きだからこそ、素直になれない。 — あと3分だけ。</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="episode-05-story.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body class="episode-five">
  <main>
    <section id="welcome" aria-labelledby="welcome-title">
      <a class="world-picker" href="../index.html#worlds">← 世界を選び直す</a>
      <div class="moon" aria-hidden="true"></div>
      <p class="eyebrow">好きだからこそ、素直になれない。</p>
      <h1 id="welcome-title">あと3分だけ。</h1>
      <p class="intro">両想い。でも、告白はそっちから。<br>友人たちの前で、今日も心理戦。</p>
      <div class="choices">
        <button id="with-sound" type="button" disabled>音ありで見る <span aria-hidden="true">↗</span></button>
        <button id="without-sound" type="button" disabled>音なしで見る</button>
      </div>
      <p class="hint">75秒の物語＋15秒の余韻・紹介 · タップで次の場面へ<br>「音ありで見る」を選ぶとBGMが流れます。</p>
      <p id="loading" class="hint" role="status">画像を準備しています…</p>
    </section>
    <section id="player" aria-label="好きだからこそ、素直になれない。の物語" hidden>
      <div id="scenes"></div>
      <button id="next" type="button" aria-label="次の場面へ"></button>
      <div class="brand" aria-hidden="true">あと3分だけ。</div>
      <p id="scene-description" class="sr-only" aria-live="polite"></p>
      <section id="introduction" aria-label="物語の続きへ" hidden>
        <p id="intro-first" class="intro-line" hidden>好きだからこそ、素直になれない。</p>
        <p id="intro-second" class="intro-line" hidden>恋は、ときどき頭脳戦になる。</p>
        <p id="intro-third" class="intro-line" hidden>そんな二人を、もっと見ていたくなったあなたへ。</p>
        <div id="intro-work" hidden>
          <h2>かぐや様は告らせたい</h2>
          <a id="work-cta" href="kaguya.html" hidden>この物語を覗いてみる →</a>
        </div>
      </section>
      <div class="controls">
        <div class="progress" role="progressbar" aria-label="物語の進行" aria-valuemin="0" aria-valuemax="75" aria-valuenow="0"><div id="progress-fill"></div></div>
        <div class="control-row">
          <button id="toggle" type="button">一時停止</button>
          <span id="time" aria-hidden="true">0:00 / 1:15</span>
          <button id="restart" type="button">最初から</button>
        </div>
      </div>
    </section>
  </main>
  <audio id="bgm" src="assets/audio/Fancy_Pop.mp3" preload="metadata" loop hidden></audio>
  <noscript>この物語を見るには、ブラウザのJavaScriptを有効にしてください。</noscript>
